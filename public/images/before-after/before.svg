<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4B7FA8"/>
      <stop offset="100%" stop-color="#96C5DC"/>
    </linearGradient>
    <linearGradient id="bgnd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4E8E34"/>
      <stop offset="100%" stop-color="#386825"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1600" height="900" fill="url(#bsky)"/>

  <!-- Clouds left -->
  <ellipse cx="270" cy="125" rx="158" ry="54" fill="rgba(255,255,255,0.72)"/>
  <ellipse cx="375" cy="105" rx="105" ry="46" fill="rgba(255,255,255,0.78)"/>
  <ellipse cx="168" cy="150" rx="88" ry="40" fill="rgba(255,255,255,0.65)"/>
  <!-- Clouds right -->
  <ellipse cx="1185" cy="162" rx="138" ry="50" fill="rgba(255,255,255,0.62)"/>
  <ellipse cx="1080" cy="145" rx="92" ry="40" fill="rgba(255,255,255,0.68)"/>

  <!-- House - main body -->
  <rect x="905" y="285" width="625" height="215" fill="#DDD4C0"/>
  <!-- Roof -->
  <polygon points="880,285 1555,285 1217,168" fill="#7B5C40"/>
  <!-- Chimney -->
  <rect x="1362" y="188" width="38" height="78" fill="#8C7060"/>
  <!-- Windows -->
  <rect x="942" y="328" width="96" height="74" fill="#8ABAD0" rx="4"/>
  <line x1="990" y1="328" x2="990" y2="402" stroke="#C8BEB0" stroke-width="2"/>
  <line x1="942" y1="365" x2="1038" y2="365" stroke="#C8BEB0" stroke-width="2"/>
  <rect x="1115" y="328" width="96" height="74" fill="#8ABAD0" rx="4"/>
  <line x1="1163" y1="328" x2="1163" y2="402" stroke="#C8BEB0" stroke-width="2"/>
  <line x1="1115" y1="365" x2="1211" y2="365" stroke="#C8BEB0" stroke-width="2"/>
  <rect x="1305" y="328" width="96" height="74" fill="#8ABAD0" rx="4"/>
  <line x1="1353" y1="328" x2="1353" y2="402" stroke="#C8BEB0" stroke-width="2"/>
  <line x1="1305" y1="365" x2="1401" y2="365" stroke="#C8BEB0" stroke-width="2"/>
  <!-- Door -->
  <rect x="1145" y="420" width="84" height="80" fill="#6A4E38" rx="3"/>
  <circle cx="1217" cy="461" r="5" fill="#C0A050"/>
  <!-- Garage -->
  <rect x="1375" y="400" width="148" height="100" fill="#C5BAA8"/>
  <rect x="1378" y="403" width="142" height="94" fill="#B9AE9E"/>
  <line x1="1449" y1="403" x2="1449" y2="497" stroke="#A09888" stroke-width="2"/>
  <line x1="1378" y1="437" x2="1520" y2="437" stroke="#A09888" stroke-width="1.5"/>
  <line x1="1378" y1="465" x2="1520" y2="465" stroke="#A09888" stroke-width="1.5"/>
  <!-- Foundation -->
  <rect x="905" y="497" width="625" height="8" fill="#C5B8A2"/>

  <!-- Trees left — background canopies drawn behind fence line -->
  <!-- Tree 1 trunk -->
  <rect x="196" y="420" width="24" height="130" fill="#6B4A2C"/>
  <!-- Tree 1 canopy layers -->
  <ellipse cx="208" cy="330" rx="122" ry="132" fill="#1C4A06"/>
  <ellipse cx="165" cy="362" rx="92" ry="100" fill="#1E5208"/>
  <ellipse cx="258" cy="352" rx="86" ry="95" fill="#163E04"/>
  <ellipse cx="208" cy="292" rx="76" ry="70" fill="#245C0A"/>

  <!-- Tree 2 trunk -->
  <rect x="458" y="432" width="20" height="110" fill="#6B4A2C"/>

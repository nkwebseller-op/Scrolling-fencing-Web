  <polygon points="1100,900 1395,900 1528,500 1205,500" fill="#BEB5A5"/>
  <line x1="1100" y1="900" x2="1528" y2="500" stroke="#AEAA98" stroke-width="1.5"/>
  <line x1="1395" y1="900" x2="1528" y2="500" stroke="#AEAA98" stroke-width="1.5"/>

  <!-- Lawn texture hints -->
  <ellipse cx="660" cy="700" rx="92" ry="28" fill="rgba(0,0,0,0.028)"/>
  <ellipse cx="305" cy="790" rx="72" ry="22" fill="rgba(0,0,0,0.035)"/>
  <ellipse cx="820" cy="820" rx="60" ry="18" fill="rgba(0,0,0,0.025)"/>

  <!-- Sidewalk -->
  <rect y="858" width="1600" height="42" fill="#BEB5A8"/>
  <rect y="858" width="1600" height="2" fill="rgba(0,0,0,0.12)"/>

  <!-- Sample label -->
  <rect y="858" width="1600" height="42" fill="rgba(0,0,0,0.44)"/>
  <text x="800" y="884" font-family="system-ui,-apple-system,Arial,sans-serif" font-size="15" fill="rgba(255,255,255,0.4)" text-anchor="middle" letter-spacing="1.5">SAMPLE IMAGE — Replace with actual before project photo</text>
</svg>
